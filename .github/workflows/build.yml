name: Build iOS Simulator App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app

      - name: Compile Simulator App
        run: |
          xcodebuild -destination "platform=iOS Simulator,name=iPhone 15" \
                     -scheme TrafficRacer \
                     -configuration Release \
                     -archivePath build/TrafficRacer.xcarchive \
                     archive \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package for Appetize Simulator
        run: |
          cd build/TrafficRacer.xcarchive/Products/Applications/
          zip -r ../../../../TrafficRacerSimulator.zip TrafficRacer.app

      - name: Upload Simulator Zip
        uses: actions/upload-artifact@v3
        with:
          name: Simulator-Build
          path: TrafficRacerSimulator.zip
